
name: Robinhood Chain Scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: robinhood-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Restore scan progress
        uses: actions/cache@v4
        with:
          path: |
            state.json
            scanned_data.json
          key: robinhood-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            robinhood-state-

      - name: Install dependencies and scan
        env:
          SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
        run: |
          python -m pip install web3 requests
          python scanner.py
