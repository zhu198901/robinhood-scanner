name: Robinhood Chain Scanner

on:
  schedule:
    # 每隔 5 分钟自动运行一次（你可以改成 */10 代表每 10 分钟）
    - cron: '*/5 * * * *'
  workflow_dispatch: # 支持手动点击按钮触发测试

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install web3 requests

      - name: Run scanner
        run: |
          python scanner.py
